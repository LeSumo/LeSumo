<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comprar Aprende R | LeSumo</title>
  <style>
    :root { --navy:#16324F; --teal:#167D8D; --paper:#F7F7F2; --muted:#455565; }
    body { font-family:Arial,sans-serif; background:var(--paper); color:var(--navy); margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:24px; }
    .caja { background:#fff; width:min(100%,460px); padding:32px; border-radius:14px; box-shadow:0 4px 20px rgba(0,0,0,.08); }
    h1 { margin:0 0 8px; font-size:24px; }
    p { line-height:1.6; color:var(--muted); }
    label { display:block; margin-top:18px; font-weight:bold; }
    input { width:100%; padding:12px; border:1px solid #cfd8dc; border-radius:8px; font-size:15px; margin-top:6px; box-sizing:border-box; }
    button { width:100%; padding:14px; margin-top:18px; border:0; border-radius:8px; background:var(--teal); color:#fff; font-size:16px; font-weight:bold; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    #msg { margin-top:16px; color:#b00020; }
    .precio { font-size:28px; font-weight:bold; color:var(--teal); margin:8px 0 4px; }
  </style>
</head>
<body>
  <main class="caja">
    <h1>Aprende R</h1>
    <p>Curso interactivo de R. Acceso de por vida tras el pago.</p>
    <div class="precio" id="precio">—</div>
    <p>Introduce el correo donde quieres recibir tu enlace de acceso. Puede ser distinto al de PayPal.</p>

    <label for="correo">Correo electrónico</label>
    <input id="correo" type="email" placeholder="tu@correo.com" autocomplete="email">

    <button id="comprar" type="button">Comprar con PayPal</button>
    <div id="msg"></div>
  </main>

<script>
  // ⚠️ Reemplaza con la URL /exec de tu implementación de Apps Script
  const WEBR_URL = 'https://script.google.com/macros/s/TU_DEPLOYMENT_ID/exec';

  const $ = id => document.getElementById(id);

  // Obtener precio y clientId desde el backend
  (async () => {
    try {
      const r = await fetch(WEBR_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ funcion: 'config', parametros: {} })
      });
      // Si no tienes función config, muestra "—" y deja que el backend ponga el precio al crear la orden.
    } catch (_) {}
  })();

  $('comprar').addEventListener('click', async () => {
    const correo = $('correo').value.trim().toLowerCase();
    $('msg').textContent = '';
    if (!correo || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) {
      $('msg').textContent = 'Introduce un correo válido.';
      return;
    }
    $('comprar').disabled = true;
    $('comprar').textContent = 'Creando orden…';

    try {
      const r = await fetch(WEBR_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ funcion: 'crearOrden', parametros: { correo } })
      });
      const datos = await r.json();
      if (datos.error) throw new Error(datos.error);
      const { approvalUrl, amount, currency } = datos.resultado;
      $('precio').textContent = amount + ' ' + currency;
      // Redirigir a PayPal (fuera de iframes)
      window.location.href = approvalUrl;
    } catch (e) {
      $('msg').textContent = 'Error: ' + e.message;
      $('comprar').disabled = false;
      $('comprar').textContent = 'Comprar con PayPal';
    }
  });
</script>
</body>
</html>
