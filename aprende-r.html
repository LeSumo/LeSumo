
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <title>Acceso a Aprende R | LeSumo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #F7F7F2;
      color: #16324F;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(90%, 420px);
      box-sizing: border-box;
      padding: 32px;
      background: white;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 4px 20px #16324F18;
    }
    p { line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Aprende R</h1>
    <p>Inicia sesión con Google para comprobar tu acceso al curso.</p>
    
<div id="g_id_onload"
     data-client_id="238266082480-knh6pbgs0oee0fge25fl27a1dk8qj8pf.apps.googleusercontent.com"
     data-callback="handleCredentialResponse">
</div>

<div class="g_id_signin"
     data-type="standard"
     data-size="large"
     data-theme="outline"
     data-text="signin_with"
     data-shape="rectangular"
     data-logo_alignment="left">
</div>
    <p id="mensaje" role="status"></p>
  </main>
  
<script>
  
function handleCredentialResponse(response) {
  const mensaje = document.getElementById('mensaje');

  if (!response || !response.credential) {
    mensaje.textContent = 'No se recibió la credencial de Google.';
    return;
  }

  mensaje.textContent = 'Verificando tu identidad...';

  const formulario = document.createElement('form');
  formulario.method = 'POST';
  formulario.action =
    'https://script.google.com/macros/s/AKfycbxS8aPLiRP-rLlIJL9IEQ2tSu1BZnLbnou6qb1pSnfu8a8c7vkQl47JiQLhR1KjKkQ4/exec';

  const campo = document.createElement('input');
  campo.type = 'hidden';
  campo.name = 'credential';
  campo.value = response.credential;

  formulario.appendChild(campo);
  document.body.appendChild(formulario);
  formulario.submit();
}
</script>
</body>
</html>
